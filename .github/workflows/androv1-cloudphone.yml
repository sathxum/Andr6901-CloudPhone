name: AndroV1 Scrcpy CloudPhone (Curved Border & Perfect Mobile Fit)

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cloudphone:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Free Disk Space & Setup Hardware KVM
      run: |
        echo "========================================================"
        echo "   ANDRO V1 // FREE DISK SPACE & VERIFY HARDWARE KVM   "
        echo "========================================================"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h
        
        if [ -e /dev/kvm ]; then
          echo "[SUCCESS] /dev/kvm hardware virtualization is present!"
          sudo chmod 777 /dev/kvm
        else
          echo "[WARNING] /dev/kvm not found, checking fallback."
        fi
        
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl jq ffmpeg adb scrcpy nodejs npm
        
        sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
        sudo chmod +x /usr/local/bin/cloudflared

    - name: Launch Real Google Android Phone (Clean Raw Screen - No Skin)
      run: |
        echo "========================================================"
        echo "   STARTING CLEAN ANDROID PHONE (NO SKIN - RAW DISPLAY) "
        echo "========================================================"
        echo "Selected Android Engine Image: budtmo/docker-android:emulator_14.0"
        
        sudo docker run -d --name androv1-phone \
          --privileged \
          --device /dev/kvm \
          -p 5555:5555 \
          -e EMULATOR_NO_SKIN=true \
          -e WEB_VNC=false \
          -e AUDIO=true \
          budtmo/docker-android:emulator_14.0

        echo "[INFO] Waiting for Android ADB connection on 127.0.0.1:5555..."
        for i in $(seq 1 60); do
          if adb connect 127.0.0.1:5555 2>/dev/null | grep -q "connected"; then
            echo "[SUCCESS] Connected to Android ADB on 127.0.0.1:5555!"
            break
          fi
          echo "Waiting for ADB port 5555... ($i/60)"
          sleep 3
        done

        echo "[INFO] Waiting for Android OS boot to complete..."
        adb -s 127.0.0.1:5555 wait-for-device
        for i in $(seq 1 60); do
          BOOT_STATUS=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
          if [ "$BOOT_STATUS" = "1" ]; then
            echo "[SUCCESS] Android OS has fully booted to Home Screen!"
            break
          fi
          echo "Booting Android system... ($i/60)"
          sleep 4
        done

    - name: Launch ws-scrcpy Streaming Engine (Internal Port 8001)
      run: |
        echo "========================================================"
        echo "   STARTING SCRCPY WEB STREAMER (INTERNAL PORT 8001)    "
        echo "========================================================"
        sudo mkdir -p /tmp/ws-scrcpy-data
        cat << 'EOF' | sudo tee /tmp/ws-scrcpy-data/config.json
        {
          "webPort": 8000,
          "firstRunComplete": true,
          "allowRemoteAdmin": true,
          "allowedHosts": [
            "localhost",
            "127.0.0.1",
            "0.0.0.0",
            "localhost:8001"
          ]
        }
        EOF

        # Run ws-scrcpy mapping internal 8000 to host 8001
        sudo docker run -d --name ws-scrcpy \
          -p 8001:8000 \
          -v /tmp/ws-scrcpy-data:/data \
          -e WS_SCRCPY_NO_BROWSER=1 \
          bilbospocketses/ws-scrcpy-web:latest

        echo "[INFO] Waiting for ws-scrcpy on internal port 8001..."
        for i in $(seq 1 45); do
          if curl -s -I http://127.0.0.1:8001 > /dev/null 2>&1; then
            echo "[SUCCESS] Scrcpy Web Streamer is ready on port 8001!"
            break
          fi
          sleep 2
        done

        # Patch container to accept all origins
        sudo docker exec ws-scrcpy node -e "
        const fs = require('fs');
        for (const p of ['/app/dist/index.js', '/app/dist/server/index.js']) {
          if (fs.existsSync(p)) {
            let s = fs.readFileSync(p, 'utf8');
            s = s.replaceAll('host not allowed (possible DNS rebinding)', 'allowed');
            s = s.replace(/isHostAllowed\s*=\s*function[^{]*\{/g, '\$&return true;');
            s = s.replace(/function isHostAllowed[^{]*\{/g, '\$&return true;');
            fs.writeFileSync(p, s);
          }
        }
        " || true
        sudo docker restart ws-scrcpy
        sleep 3

    - name: Deploy Curved-Border Mobile Gateway (Port 8000 - Anti-Scroll & Perfect Fit)
      run: |
        echo "========================================================"
        echo "   DEPLOYING ANDROV1 CURVED MOBILE GATEWAY (PORT 8000)  "
        echo "========================================================"
        cat << 'EOF' > /tmp/gateway.js
        const http = require('http');
        const net = require('net');
        const url = require('url');
        const { exec } = require('child_process');

        const HTML_CONTENT = `<!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>AndroV1 CloudPhone</title>
          <link rel="stylesheet" href="/ws-scrcpy.css">
          <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body {
              width: 100vw;
              height: 100dvh;
              overflow: hidden !important;
              background: #000000;
              color: #ffffff;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              overscroll-behavior: none !important;
              touch-action: none !important;
              user-select: none !important;
              -webkit-user-select: none !important;
            }
            #viewport {
              position: fixed;
              inset: 0;
              width: 100vw;
              height: 100dvh;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              background: #050508;
            }
            /* Realistic curved screen frame: perfectly fits user mobile screen */
            #phone-frame {
              position: relative;
              width: 100vw;
              height: 100dvh;
              max-width: 480px;
              max-height: 100dvh;
              display: flex;
              flex-direction: column;
              border-radius: 36px;
              overflow: hidden;
              background: #000000;
              border: 3px solid #222230;
              box-shadow: 0 0 40px rgba(0,0,0,0.95);
              transition: all 0.2s ease;
            }
            @media (max-width: 600px) {
              #phone-frame {
                border-radius: 28px;
                border: 2px solid #1a1a24;
                max-width: 100vw;
                width: 100vw;
                height: 100dvh;
              }
            }
            /* Stream container fills screen */
            #stream-container {
              position: relative;
              flex: 1;
              width: 100%;
              height: 100%;
              overflow: hidden;
              touch-action: none !important;
              overscroll-behavior: none !important;
              display: flex;
              align-items: center;
              justify-content: center;
              background: #000000;
            }
            #stream-container .device-view,
            #stream-container video,
            #stream-container canvas {
              width: 100% !important;
              height: 100% !important;
              object-fit: contain !important;
              touch-action: none !important;
              overscroll-behavior: none !important;
            }
            /* Soft Android navigation bar at bottom */
            #android-nav {
              height: 48px;
              background: rgba(10, 10, 16, 0.96);
              border-top: 1px solid rgba(255, 255, 255, 0.08);
              display: flex;
              align-items: center;
              justify-content: space-around;
              padding: 0 24px;
              z-index: 50;
            }
            .nav-btn {
              background: none;
              border: none;
              color: #888899;
              font-size: 18px;
              padding: 8px 32px;
              border-radius: 8px;
              cursor: pointer;
              transition: all 0.15s ease;
              touch-action: manipulation;
            }
            .nav-btn:active {
              color: #0aff0a;
              background: rgba(255, 255, 255, 0.1);
              transform: scale(0.9);
            }
            /* Floating quick tools */
            #floating-bar {
              position: absolute;
              top: 10px;
              right: 12px;
              display: flex;
              gap: 8px;
              z-index: 60;
            }
            .float-btn {
              background: rgba(0, 0, 0, 0.65);
              backdrop-filter: blur(8px);
              border: 1px solid rgba(255, 255, 255, 0.15);
              color: #e0e0e0;
              width: 34px;
              height: 34px;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 13px;
              cursor: pointer;
            }
            .float-btn:active {
              background: rgba(10, 255, 10, 0.3);
              color: #0aff0a;
            }
            #toast {
              position: fixed;
              bottom: 60px;
              left: 50%;
              transform: translateX(-50%);
              background: rgba(10, 255, 10, 0.2);
              border: 1px solid #0aff0a;
              color: #0aff0a;
              font-size: 12px;
              padding: 6px 16px;
              border-radius: 20px;
              font-family: monospace;
              z-index: 100;
              opacity: 0;
              transition: opacity 0.3s;
              pointer-events: none;
            }
            #toast.show { opacity: 1; }
            #loader {
              position: absolute;
              inset: 0;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              background: #000000;
              z-index: 40;
              font-family: monospace;
              color: #0aff0a;
            }
            .spinner {
              width: 40px;
              height: 40px;
              border: 3px solid rgba(10, 255, 10, 0.2);
              border-top-color: #0aff0a;
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
              margin-bottom: 12px;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
          </style>
        </head>
        <body>
          <div id="viewport">
            <div id="phone-frame">
              <div id="floating-bar">
                <button onclick="syncClipboard()" class="float-btn" title="Sync Clipboard"><i class="fas fa-clipboard"></i></button>
                <button onclick="sendKey('volume_up')" class="float-btn" title="Volume Up"><i class="fas fa-volume-up"></i></button>
                <button onclick="sendKey('volume_down')" class="float-btn" title="Volume Down"><i class="fas fa-volume-down"></i></button>
                <button onclick="sendKey('power')" class="float-btn" title="Power"><i class="fas fa-power-off"></i></button>
              </div>

              <div id="stream-container">
                <div id="loader">
                  <div class="spinner"></div>
                  <div>CONNECTING 60 FPS SCRCPY...</div>
                  <div style="font-size: 11px; color: #888; margin-top: 4px;">Curved Edge Mobile Screen</div>
                </div>
              </div>

              <div id="android-nav">
                <button onclick="sendKey('back')" class="nav-btn" title="Back"><i class="fas fa-chevron-left"></i></button>
                <button onclick="sendKey('home')" class="nav-btn" title="Home"><i class="far fa-circle"></i></button>
                <button onclick="sendKey('recents')" class="nav-btn" title="Recents"><i class="far fa-square"></i></button>
              </div>
            </div>
          </div>

          <div id="toast"></div>

          <script src="/ws-scrcpy.umd.js"></script>
          <script>
            const streamContainer = document.getElementById('stream-container');
            const loader = document.getElementById('loader');
            const toast = document.getElementById('toast');

            function showToast(msg) {
              toast.textContent = msg;
              toast.classList.add('show');
              setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // Lock touch: prevents outer page scrolling completely
            const preventScroll = (e) => {
              if (e.cancelable) e.preventDefault();
              e.stopPropagation();
            };
            document.addEventListener('touchmove', preventScroll, { passive: false });
            document.addEventListener('wheel', (e) => e.stopPropagation(), { passive: false });

            function sendKey(action) {
              navigator.vibrate?.([15]);
              fetch('/api/control?action=' + action).catch(() => {});
            }

            async function syncClipboard() {
              try {
                const text = await navigator.clipboard.readText();
                if (text) {
                  await fetch('/api/control?action=clipboard&text=' + encodeURIComponent(text));
                  showToast('Clipboard Synced to Android! 📋');
                  return;
                }
              } catch (e) {}
              const input = prompt('Enter text to paste into Android:');
              if (input) {
                await fetch('/api/control?action=clipboard&text=' + encodeURIComponent(input));
                showToast('Text sent to Android! 📋');
              }
            }

            function initStream() {
              if (!window.WsScrcpy) {
                setTimeout(initStream, 300);
                return;
              }
              try {
                window.WsScrcpy.startStream(streamContainer, '127.0.0.1:5555', {
                  deviceKind: 'phone',
                  audio: true,
                  keyboard: true,
                  onConnect: () => {
                    if (loader) loader.style.display = 'none';
                    showToast('60 FPS Scrcpy Connected! 📱');
                  },
                  onError: (err) => {
                    console.error(err);
                    if (loader) loader.innerHTML = '<div style="color:#ff4444">Stream Error: ' + err.message + '</div>';
                  }
                });
              } catch (e) {
                console.error(e);
              }
            }
            window.addEventListener('DOMContentLoaded', initStream);
          </script>
        </body>
        </html>`;

        const server = http.createServer((req, res) => {
          const parsed = url.parse(req.url, true);

          // Serve the curved-border mobile web client
          if (parsed.pathname === '/' || parsed.pathname === '/index.html') {
            res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
            res.end(HTML_CONTENT);
            return;
          }

          // Handle Soft Android Keys and Clipboard
          if (parsed.pathname === '/api/control') {
            const action = parsed.query.action;
            const text = parsed.query.text;
            if (action === 'back') exec('adb -s 127.0.0.1:5555 shell input keyevent 4');
            else if (action === 'home') exec('adb -s 127.0.0.1:5555 shell input keyevent 3');
            else if (action === 'recents') exec('adb -s 127.0.0.1:5555 shell input keyevent 187');
            else if (action === 'power') exec('adb -s 127.0.0.1:5555 shell input keyevent 26');
            else if (action === 'volume_up') exec('adb -s 127.0.0.1:5555 shell input keyevent 24');
            else if (action === 'volume_down') exec('adb -s 127.0.0.1:5555 shell input keyevent 25');
            else if (action === 'clipboard' && text) {
              const sanitized = text.replace(/[^a-zA-Z0-9 ./_=@:-]/g, '');
              exec(`adb -s 127.0.0.1:5555 shell input text "${sanitized}"`);
            }
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ ok: true }));
            return;
          }

          // Proxy all assets to ws-scrcpy on 127.0.0.1:8001 rewriting Host to localhost:8001
          const proxyReq = http.request({
            hostname: '127.0.0.1',
            port: 8001,
            path: req.url,
            method: req.method,
            headers: {
              ...req.headers,
              host: 'localhost:8001',
            },
          }, (proxyRes) => {
            res.writeHead(proxyRes.statusCode, proxyRes.headers);
            proxyRes.pipe(res);
          });
          proxyReq.on('error', () => {
            res.writeHead(502);
            res.end('Gateway Error');
          });
          req.pipe(proxyReq);
        });

        // Proxy WebSocket upgrades rewriting Host to localhost:8001
        server.on('upgrade', (req, clientSocket, head) => {
          const targetSocket = net.connect(8001, '127.0.0.1', () => {
            let raw = `${req.method} ${req.url} HTTP/1.1\r\n`;
            for (const [k, v] of Object.entries(req.headers)) {
              if (k.toLowerCase() === 'host') {
                raw += 'Host: localhost:8001\r\n';
              } else {
                raw += `${k}: ${v}\r\n`;
              }
            }
            raw += '\r\n';
            targetSocket.write(raw);
            if (head && head.length) targetSocket.write(head);
            clientSocket.pipe(targetSocket);
            targetSocket.pipe(clientSocket);
          });
          targetSocket.on('error', () => clientSocket.destroy());
          clientSocket.on('error', () => targetSocket.destroy());
        });

        server.listen(8000, () => {
          console.log('[GATEWAY] AndroV1 Mobile Gateway listening on port 8000 -> ws-scrcpy 8001');
        });
        EOF

        nohup node /tmp/gateway.js > /tmp/gateway.log 2>&1 &
        sleep 2
        curl -s -I http://127.0.0.1:8000 | head -1
        echo "[SUCCESS] Mobile Gateway online on port 8000!"

    - name: Establish Live Tunnel & Publish Phone URL
      run: |
        echo "========================================================"
        echo "   ESTABLISHING LIVE TUNNEL (PORT 8000 GATEWAY)         "
        echo "========================================================"
        echo "Starting Cloudflare tunnel on port 8000..."
        if ! command -v cloudflared >/dev/null 2>&1; then
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
        fi
        nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/tunnel.log 2>&1 &
        TUNNEL_URL=""
        for i in $(seq 1 50); do
          sleep 2
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log | head -1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            break
          fi
        done
        
        if [ -z "$TUNNEL_URL" ]; then
          echo "[ERROR] Tunnel could not be established. Log:"
          cat /tmp/tunnel.log
          exit 1
        fi
        
        echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
        
        echo "### 📱 REAL ANDROID CLOUDPHONE (CURVED BORDER & PERFECT MOBILE FIT) IS LIVE!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 👉 [CLICK HERE TO OPEN YOUR ANDROID PHONE]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Feature | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| 📱 **Direct Mobile URL** | **[$TUNNEL_URL]($TUNNEL_URL)** | **Open directly in mobile Chrome/Safari** |" >> $GITHUB_STEP_SUMMARY
        echo "| 📐 **Display Calibration** | ✅ ACTIVE | 100% Mobile Screen Fit (`100dvh`) - Neither too small nor overflowing |" >> $GITHUB_STEP_SUMMARY
        echo "| 📱 **Curved Border** | ✅ ACTIVE | Flagship curved screen corners (`border-radius: 28px`) |" >> $GITHUB_STEP_SUMMARY
        echo "| 👆 **Touch Isolation** | ✅ ACTIVE | Zero Webpage Scroll (`touch-action: none`) - Pure butter-smooth gestures |" >> $GITHUB_STEP_SUMMARY
        echo "| 🎮 **Soft Navigation Keys** | ✅ ACTIVE | Back, Home, Recents buttons with haptic feedback |" >> $GITHUB_STEP_SUMMARY
        echo "| 📋 **2-Way Clipboard Sync** | ✅ ACTIVE | Sync mobile device clipboard directly to Android |" >> $GITHUB_STEP_SUMMARY
        echo "| 🛡️ **DNS Rebinding Shield** | ✅ ACTIVE | Host rewritten by Gateway; 100% immune |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Mobile Instructions:** Click the link above on your phone. The phone screen will immediately take over your entire display with curved borders and zero page-scroll!" >> $GITHUB_STEP_SUMMARY
        
        echo "::notice title=Open Android Phone::$TUNNEL_URL"
        echo "=========================================================="
        echo "       ANDRO V1 // CLOUDPHONE READY!                      "
        echo "=========================================================="
        echo "⚡ DIRECT MOBILE PHONE URL (CLICK TO OPEN):"
        echo "==> $TUNNEL_URL <=="
        echo "=========================================================="

    - name: Keep Alive Monitor
      run: |
        echo "Android CloudPhone session active for 6 hours max..."
        echo "Direct Phone URL: ${{ env.TUNNEL_URL }}"
        for i in {358..1}; do
            sleep 60
        done